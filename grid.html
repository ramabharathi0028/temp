<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,150px);
            gap: 20px;
            margin: 10px;
        }
        .grid-item{
            background-color: grey;
            border: 1px solid black;
            justify-content: center;
            align-items: center;
        }
        .grid1 div{
            display: grid;
            background-color: azure;
            font-size: 30px;
            border: 1px solid black;
            justify-content: center;
            align-items: center;


        }
        .grid1{
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-template-areas: 
            "h h h"
            "sd ma ma"
            "f f f";
            /* height: 100px; */
            /* padding: 20px; */
             
            
        }
        .main{
            grid-area: h;
            padding: 20px;
            /* grid-template-rows: repeat(zz); */
            
            
        }
        .side{
            grid-area: sd;
            padding: 20px;
            grid-template-rows: repeat(2,100px);
            justify-content: center;
            align-items: center;
        }
        .mainc{
            grid-area: ma;
            padding: 20px;
        }
        .foot{
            grid-area: f;
            padding: 20px;
        }
        .container{
            display: grid;
            grid-template-columns: repeat(auto-fit , minmax(200px,1fr));
            gap: 20px;
            /* grid-template-rows: 100px 200px 100px; */
        }
        .card {
            width: 200px;
            
            padding: 25px;
            border: 1px solid blue;
            border-radius: 10px;
            text-align: center;
        }
        .gallery{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-auto-rows: 200px;
            gap: 20px;
            
        }
        .image{
            overflow: hidden;
        }
        .image img{
            width: 100%;
            height: 100%;
            /* object-fit: cover; */
        }
        .imag1{
            grid-column: span 2;
        }
        .imag3{
            grid-row: span 2;
        }
        
        
    </style>
</head>
<body>
    <h2>Task 1</h2>
    <div class="grid">
        <div class="grid-item">Item1</div>
        <div class="grid-item">Item2</div>
        <div class="grid-item">Item3</div>
        <div class="grid-item">Item4</div>
        <div class="grid-item">Item5</div>
        <div class="grid-item">Item6</div>
    </div>

    <div class="grid1">
        <div class="main">main</div>
        <div class="side">side bar</div>
        <div class="mainc">main content</div>
        <div class="foot">Footer</div>

    </div>

    <div class="container">
        <div class="card">Item1</div>
        <div class="card">Item2</div>
        <div class="card">Item3</div>
        <div class="card">Item4</div>
        <div class="card">Item5</div>
        <div class="card">Item6</div>
    </div>
    <!-- <div class="container">
        <div class="card">item 1</div>
    </div> -->
    <div class="gallery">
        <div class="image imag1">
            <img src="/ani.jpg" alt="">
        </div>
        <div class="image imag2">
            <img src="/cat.jpg" alt="">
        </div>
        <div class="image imag3">
            <img src="/download.jpg" alt="">
        </div>
        <div class="image imag4">
            <img src="/dra.jpg" alt="">
        </div>
        <div class="image imag5">
            <img src="/nat.jpg" alt="">
        </div>
        <div class="image imag6">
            <img src="/natu.jpg" alt="">
        </div>
    </div>
</body>
</html>
